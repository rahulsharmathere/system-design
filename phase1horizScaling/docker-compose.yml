services:
  nginx:
    image: nginx #when image not present locally (no Dockerfile)
    ports:
      - 8000:80
    volumes:
      # use volumes to write in container's folders file
      # - hostPath:containerPath
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  
  server1:
    build: ./server  # when have a Dockerfile (image)
    env_file: # provide all env variables
      - ./server/.env
    environment:
      - SERVER_NAME=pehla server
    ports:
      - 5001:7000

  server2:
    build: ./server  # when have a Dockerfile (image)
    env_file: # provide all env variables
      - ./server/.env
    environment:
      - SERVER_NAME=dusra server
    ports:
      - 5002:7000

  server3:
    build: ./server  # when have a Dockerfile (image)
    env_file: # provide all env variables
      - ./server/.env
    environment:
      - SERVER_NAME=teesra server
    ports:
      - 5003:7000

  redis:
    image: redis